[project]
name = "cs-match-tracker"
version = "0.1.0"
description = "A local application for tracking Counter-Strike teams and comparing their performance."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "httpx2>=2.13.1",
    "pydantic>=2.13.5",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[build-system]
requires = ["uv_build>=0.11.21,<0.12"]
build-backend = "uv_build"

[project.scripts]
cs-match-tracker = "cs_match_tracker.cli:main"
